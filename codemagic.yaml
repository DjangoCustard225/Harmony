workflows:
  harmony-unsigned-ipa:
    name: Harmony unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Xcode 27 (or newer) is required for the iOS 27 deployment target and Swift 6.4.
      # Pin an explicit version here if "latest" does not have the iOS 27 SDK yet.
      xcode: latest
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Show toolchain versions
        script: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run HarmonyCore tests
        script: |
          swift test --package-path Core
      - name: Build and verify unsigned IPA
        script: |
          bash Scripts/BuildIPA.sh build/ios dist/Harmony.ipa
    artifacts:
      - dist/Harmony.ipa
