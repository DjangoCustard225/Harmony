workflows:
  harmony-unsigned-ipa:
    name: Harmony unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Harmony requires the iOS 27 SDK and Swift 6.4.
      xcode: "27.2"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Show toolchain versions
        script: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run HarmonyCore tests
        script: |
          swift test --package-path Core
      - name: Check Swift formatting
        script: |
          swift format lint --strict --recursive Harmony Core/Sources Core/Tests Scripts Package.swift Core/Package.swift
      - name: Build and verify unsigned IPA
        script: |
          bash Scripts/BuildIPA.sh build/ios dist/Harmony.ipa
    artifacts:
      - dist/Harmony.ipa
      - /tmp/xcodebuild_logs/*.log

  harmony-testflight:
    name: Harmony TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Started by hand in Codemagic; it is not triggered by pushes.
    integrations:
      app_store_connect: harmony-asc
    environment:
      xcode: "27.2"
      vars:
        BUNDLE_ID: app.harmony.music
        APP_STORE_APPLE_ID: 6833773273
        TEAM_ID: V8A4AS5K3W
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Show toolchain versions
        script: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run HarmonyCore tests
        script: |
          swift test --package-path Core
      - name: Check Swift formatting
        script: |
          swift format lint --strict --recursive Harmony Core/Sources Core/Tests Scripts Package.swift Core/Package.swift
      - name: Set the build number above TestFlight's latest
        script: |
          # Never go below the number committed in Info.plist; TestFlight rejects repeated build numbers.
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Harmony/Info.plist)
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 || true)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          if (( LATEST >= CURRENT )); then NEXT=$((LATEST + 1)); else NEXT=$CURRENT; fi
          echo "Info.plist build $CURRENT, TestFlight latest $LATEST, uploading build $NEXT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" Harmony/Info.plist
      - name: Generate the Xcode project
        script: |
          swift Scripts/GenerateXcodeProject.swift
      - name: Build and sign the IPA with Xcode automatic signing
        script: |
          set -euo pipefail
          # Xcode creates and manages the distribution certificate and App Store profile
          # through the App Store Connect API key, so no signing files are stored here.
          KEY_FILE="$HOME/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_FILE"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )
          mkdir -p build/ios/ipa
          cat > build/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>destination</key><string>export</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild archive -project Harmony.xcodeproj -scheme Harmony -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ios/Harmony.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath build/ios/Harmony.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist build/ios/ExportOptions.plist "${AUTH[@]}"
          rm -f "$KEY_FILE"
      - name: Check the signed IPA
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > /tmp/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/Info.plist)" = "$BUNDLE_ID"
          echo "Built $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/Info.plist) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /tmp/Info.plist))"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers receive processed builds without Apple's beta review.
        submit_to_testflight: false
